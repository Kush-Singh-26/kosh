run:
  timeout: 3m
  concurrency: 4

linters:
  enable:
    - gofmt
    - govet
    - misspell
    - unconvert
    - ineffassign
    - gosimple
    - staticcheck
    - unused
    - errcheck
  disable:
    - typecheck

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: builder/models/searchpkg/
      linters:
        - gofmt
        - goimports
    - path: builder/mocks/
      linters:
        - gofmt
        - goimports

linters-settings:
  goimports:
    local-prefixes: github.com/Kush-Singh-26/kosh
  misspell:
    locale: US
