version: 2

linters-settings:
  misspell:
    locale: US

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - errorlint
    - errcheck

issues:
  exclude-dirs:
    - public
    - bin
    - tmp
  exclude-rules:
    - path: _test\.go
      linters:
        - errorlint
        - errcheck

run:
  timeout: 5m
  tests: true
