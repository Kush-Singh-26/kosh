version: 2

linters-settings:
  misspell:
    locale: US
  gocyclo:
    min-complexity: 15
  revive:
    exported:
      check-private: true
    var-naming:
      - JSON
      - URL
      - ID
      - API
  funlen:
    lines: 50
    statements: 40

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - errorlint
    - errcheck
    - revive
    - gocritic
    - gocyclo
    - funlen

issues:
  exclude-dirs:
  - public
  - bin
  - tmp
  exclude-rules:
  - path: _test\.go
    linters:
    - funlen
    - gocyclo
  - path: tests
    linters:
    - funlen
    - gocyclo
  - path: msgp_methods\.go
    linters:
    - funlen
    - gocyclo
  - path: scripts
    linters:
    - funlen
    - gocyclo
  - linters:
    - gocritic
    text: "exitAfterDefer"
  - path: builder/orchestration/
    linters:
      - revive
    text: "unused-parameter|exported"
  - path: builder/cache/
    linters:
    - revive
    text: "unused-parameter"
  - path: builder/renderer/
    linters:
    - revive
    text: "unused-parameter"
  - path: builder/search/
    linters:
    - revive
    text: "unused-parameter"
  - path: builder/pools/
    linters:
    - revive
    text: "unused-parameter"
  - path: builder/testutil/
    linters:
    - revive
    text: "unused-parameter|exported"
  - path: internal/
    linters:
    - revive
    text: "unused-parameter"

run:
  timeout: 5m
  tests: false
