version: "2"

run:
  timeout: 3m
  concurrency: 4

linters:
  default: none
  enable:
    - govet
    - misspell
    - unconvert
    - ineffassign
    - staticcheck
    - unused
    - errcheck
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: builder/models/searchpkg/
        linters:
          - gofmt
          - goimports
      - path: builder/mocks/
        linters:
          - gofmt
          - goimports
  settings:
    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Kush-Singh-26/kosh
