name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      
      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o kosh-linux-amd64 ./cmd/kosh
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o kosh-linux-arm64 ./cmd/kosh
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o kosh-darwin-amd64 ./cmd/kosh
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o kosh-darwin-arm64 ./cmd/kosh
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o kosh-windows-amd64.exe ./cmd/kosh
      
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: kosh-*
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger portfolio rebuild
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
          repository: Kush-Singh-26/Kush-Singh-26.github.io
          event-type: kosh-updated
          client-payload: '{"version": "${{ github.event.release.tag_name }}"}'
