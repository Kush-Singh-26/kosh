repos:
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --tests=false
        language: system
        types: [go]
        pass_filenames: false

      - id: go-test
        name: Go Tests
        entry: go test ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: Go Mod Tidy
        entry: go mod tidy
        language: system
        types: [go]
        files: 'go\.mod|go\.sum'
